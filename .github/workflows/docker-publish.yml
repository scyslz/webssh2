name: Build and Push Docker Image


on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
    types: [opened, synchronize]

  workflow_dispatch:
    inputs:
      ref:
        description: "Branch / Tag / Commit"
        required: false
        default: "main"

jobs:
  build-and-push:
    name: Build Docker Image
    runs-on: ubuntu-latest


    permissions:
      contents: read

    env:
      IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/webssh2

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Debug (Environment Secrets)
        shell: bash
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "Docker username length: ${#DOCKER_USERNAME}"

          if [ -n "$DOCKER_PASSWORD" ]; then
            echo "Docker password: OK"
          else
            echo "Docker password: MISSING"
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generate tags
        id: meta
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          TAGS="${{ env.IMAGE_NAME }}:sha-${SHORT_SHA}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="${{ github.ref_name }}"
            VER="${VER#v}"
            TAGS="$TAGS,${{ env.IMAGE_NAME }}:${VER}"
          fi
          TAGS="$TAGS,${{ env.IMAGE_NAME }}:latest"
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "Tags:"
          echo "${TAGS}" | tr ',' '\n'

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
