<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content：软键盘弹出时让**布局视口**跟着缩小，
         而不是把视觉视口滚一段（后者表现为整页上移）。Safari 不吃这个属性，
         由 App 里 visualViewport 的 offsetTop 补偿兜底。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>WebSSH</title>
    <meta name="description" content="Web-based SSH terminal and SFTP client" />
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WebSSH" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <script>
      (function(){
        var p = window.location.pathname.replace(/\/index\.html?$/, '').replace(/\/+$/, '');
        window.__BASE__ = p || '';
        if (p && p !== '') {
          var base = document.createElement('base');
          base.href = p + '/';
          document.head.insertBefore(base, document.head.firstChild);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="src/main.tsx"></script>
  </body>
</html>
